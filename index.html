<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Fantasy Draft Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b1020;
  color: #f5f7fb;
}

header {
  background: #11182d;
  padding: 18px 16px 14px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #28324d;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

h1 {
  margin: 0;
  font-size: 22px;
}

.subtitle {
  color: #9da8c3;
  font-size: 13px;
  margin-top: 4px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px 13px;
  font-weight: 700;
  cursor: pointer;
}

.reset {
  background: #28334f;
  color: white;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 14px;
}

.clock {
  background: #151e36;
  border: 1px solid #2b3858;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}

.clock-title {
  font-size: 12px;
  color: #8995b2;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.clock-pick {
  font-size: 26px;
  font-weight: 800;
  margin-top: 4px;
}

.clock-detail {
  color: #aeb8cf;
  font-size: 13px;
  margin-top: 3px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.panel {
  background: #11182d;
  border: 1px solid #28324d;
  border-radius: 14px;
  overflow: hidden;
}

.panel-header {
  padding: 14px;
  border-bottom: 1px solid #28324d;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-title {
  font-size: 16px;
  font-weight: 800;
}

.count {
  color: #8793b0;
  font-size: 12px;
}

.controls {
  padding: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid #28324d;
}

.search {
  flex: 1;
  min-width: 170px;
  background: #0b1020;
  color: white;
  border: 1px solid #34415f;
  border-radius: 10px;
  padding: 11px;
  font-size: 15px;
}

.filter {
  background: #202a45;
  color: #dce2ef;
}

.filter.active {
  background: #5b6cff;
  color: white;
}

.players {
  padding: 8px;
}

.player {
  display: grid;
  grid-template-columns: 35px 1fr auto;
  gap: 9px;
  align-items: center;
  padding: 12px 10px;
  border-radius: 10px;
  margin-bottom: 5px;
  background: #161f37;
  border: 1px solid transparent;
  cursor: pointer;
}

.player:hover {
  border-color: #5969ff;
}

.player.drafted {
  opacity: .35;
  text-decoration: line-through;
  cursor: default;
}

.rank {
  color: #7f8baa;
  font-size: 13px;
  font-weight: 700;
}

.player-name {
  font-weight: 800;
  font-size: 15px;
}

.meta {
  color: #8e9ab5;
  font-size: 12px;
  margin-top: 2px;
}

.value {
  text-align: right;
}

.value-number {
  font-size: 15px;
  font-weight: 800;
}

.value-label {
  color: #7f8baa;
  font-size: 10px;
}

.roster {
  padding: 12px;
}

.roster-slot {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  margin-bottom: 6px;
  background: #161f37;
  border-radius: 9px;
  font-size: 13px;
}

.roster-slot strong {
  color: #8995b2;
}

.recommendation {
  margin: 12px;
  background: linear-gradient(135deg, #202a55, #171e38);
  border: 1px solid #5264ff;
  border-radius: 12px;
  padding: 15px;
}

.rec-label {
  color: #93a0ff;
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: .08em;
}

.rec-player {
  font-size: 21px;
  font-weight: 900;
  margin-top: 4px;
}

.rec-reason {
  color: #b7c0d6;
  font-size: 13px;
  line-height: 1.4;
  margin-top: 5px;
}

@media (min-width: 800px) {
  .grid {
    grid-template-columns: 1.5fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <h1>🏆 2026 Draft Assistant</h1>
      <div class="subtitle">10-Team • Full PPR • Pick 1.01</div>
    </div>
    <button class="reset" onclick="resetDraft()">Reset</button>
  </div>
</header>

<div class="container">

  <div class="clock">
    <div class="clock-title">Your Next Pick</div>
    <div class="clock-pick" id="nextPick">1.01</div>
    <div class="clock-detail" id="pickDetail">
      You're on the clock
    </div>
  </div>

  <div class="grid">

    <div class="panel">

      <div class="panel-header">
        <div class="panel-title">Best Available</div>
        <div class="count" id="playerCount"></div>
      </div>

      <div class="controls">

        <input
          class="search"
          id="search"
          placeholder="Search players..."
          oninput="renderPlayers()"
        >

        <button class="filter active" onclick="setFilter('ALL', this)">
          All
        </button>

        <button class="filter" onclick="setFilter('RB', this)">
          RB
        </button>

        <button class="filter" onclick="setFilter('WR', this)">
          WR
        </button>

        <button class="filter" onclick="setFilter('TE', this)">
          TE
        </button>

        <button class="filter" onclick="setFilter('QB', this)">
          QB
        </button>

      </div>

      <div class="recommendation">
        <div class="rec-label">Current Recommendation</div>
        <div class="rec-player" id="recPlayer">Jahmyr Gibbs</div>
        <div class="rec-reason" id="recReason">
          Elite PPR ceiling and current consensus support. Click a player below to draft them.
        </div>
      </div>

      <div class="players" id="players"></div>

    </div>

    <div class="panel">

      <div class="panel-header">
        <div class="panel-title">My Roster</div>
        <div class="count" id="rosterCount">0 / 14</div>
      </div>

      <div class="roster" id="roster"></div>

    </div>

  </div>

</div>

<script>

const players = [

  {r:1,n:"Jahmyr Gibbs",p:"RB",t:"DET",v:100},
  {r:2,n:"Bijan Robinson",p:"RB",t:"ATL",v:98},
  {r:3,n:"Ja'Marr Chase",p:"WR",t:"CIN",v:97},
  {r:4,n:"Puka Nacua",p:"WR",t:"LAR",v:96},
  {r:5,n:"CeeDee Lamb",p:"WR",t:"DAL",v:95},
  {r:6,n:"Justin Jefferson",p:"WR",t:"MIN",v:94},
  {r:7,n:"Christian McCaffrey",p:"RB",t:"SF",v:93},
  {r:8,n:"Jaxon Smith-Njigba",p:"WR",t:"SEA",v:92},
  {r:9,n:"Jonathan Taylor",p:"RB",t:"IND",v:91},
  {r:10,n:"Amon-Ra St. Brown",p:"WR",t:"DET",v:90},
  {r:11,n:"De'Von Achane",p:"RB",t:"MIA",v:89},
  {r:12,n:"James Cook",p:"RB",t:"BUF",v:88},
  {r:13,n:"Ashton Jeanty",p:"RB",t:"LV",v:87},
  {r:14,n:"Drake London",p:"WR",t:"ATL",v:86},
  {r:15,n:"Nico Collins",p:"WR",t:"HOU",v:85},
  {r:16,n:"Malik Nabers",p:"WR",t:"NYG",v:84},
  {r:17,n:"Saquon Barkley",p:"RB",t:"PHI",v:83},
  {r:18,n:"Tee Higgins",p:"WR",t:"CIN",v:82},
  {r:19,n:"Garrett Wilson",p:"WR",t:"NYJ",v:81},
  {r:20,n:"Derrick Henry",p:"RB",t:"BAL",v:80},

  {r:21,n:"Brock Bowers",p:"TE",t:"LV",v:79},
  {r:22,n:"Breece Hall",p:"RB",t:"NYJ",v:78},
  {r:23,n:"Kyren Williams",p:"RB",t:"LAR",v:77},
  {r:24,n:"Ladd McConkey",p:"WR",t:"LAC",v:76},
  {r:25,n:"Marvin Harrison Jr.",p:"WR",t:"ARI",v:75},
  {r:26,n:"Josh Allen",p:"QB",t:"BUF",v:74},
  {r:27,n:"Trey McBride",p:"TE",t:"ARI",v:73},
  {r:28,n:"Kenneth Walker III",p:"RB",t:"SEA",v:72},
  {r:29,n:"A.J. Brown",p:"WR",t:"PHI",v:71},
  {r:30,n:"DeVonta Smith",p:"WR",t:"PHI",v:70},

  {r:31,n:"Jayden Daniels",p:"QB",t:"WAS",v:69},
  {r:32,n:"Chase Brown",p:"RB",t:"CIN",v:68},
  {r:33,n:"Jameson Williams",p:"WR",t:"DET",v:67},
  {r:34,n:"Josh Jacobs",p:"RB",t:"GB",v:66},
  {r:35,n:"Tyreek Hill",p:"WR",t:"MIA",v:65},
  {r:36,n:"Jalen Hurts",p:"QB",t:"PHI",v:64},
  {r:37,n:"Lamar Jackson",p:"QB",t:"BAL",v:63},
  {r:38,n:"Sam LaPorta",p:"TE",t:"DET",v:62},
  {r:39,n:"Travis Kelce",p:"TE",t:"KC",v:61},
  {r:40,n:"Omarion Hampton",p:"RB",t:"LAC",v:60},

  {r:41,n:"George Pickens",p:"WR",t:"DAL",v:59},
  {r:42,n:"Tyrone Tracy Jr.",p:"RB",t:"NYG",v:58},
  {r:43,n:"DJ Moore",p:"WR",t:"CHI",v:57},
  {r:44,n:"Zay Flowers",p:"WR",t:"BAL",v:56},
  {r:45,n:"Tetairoa McMillan",p:"WR",t:"CAR",v:55},
  {r:46,n:"Deebo Samuel",p:"WR",t:"WAS",v:54},
  {r:47,n:"Javonte Williams",p:"RB",t:"DAL",v:53},
  {r:48,n:"Rashee Rice",p:"WR",t:"KC",v:52},
  {r:49,n:"George Kittle",p:"TE",t:"SF",v:51},
  {r:50,n:"David Montgomery",p:"RB",t:"DET",v:50},

  {r:51,n:"Chris Olave",p:"WR",t:"NO",v:49},
  {r:52,n:"D.J. Giddens",p:"RB",t:"IND",v:48},
  {r:53,n:"Bucky Irving",p:"RB",t:"TB",v:47},
  {r:54,n:"Rachaad White",p:"RB",t:"WAS",v:46},
  {r:55,n:"Tucker Kraft",p:"TE",t:"GB",v:45},
  {r:56,n:"Rome Odunze",p:"WR",t:"CHI",v:44},
  {r:57,n:"Caleb Williams",p:"QB",t:"CHI",v:43},
  {r:58,n:"Joe Burrow",p:"QB",t:"CIN",v:42},
  {r:59,n:"Patrick Mahomes",p:"QB",t:"KC",v:41},
  {r:60,n:"Dak Prescott",p:"QB",t:"DAL",v:40}

];

let drafted = [];
let myRoster = [];
let filter = "ALL";

const rosterSlots = [
  "QB",
  "RB",
  "RB",
  "WR",
  "WR",
  "TE",
  "FLEX",
  "D/ST",
  "K",
  "BENCH",
  "BENCH",
  "BENCH",
  "BENCH",
  "BENCH"
];

function setFilter(pos, button) {

  filter = pos;

  document.querySelectorAll(".filter")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderPlayers();
}

function draftPlayer(rank) {

  const player = players.find(p => p.r === rank);

  if (!player || drafted.includes(rank)) return;

  drafted.push(rank);

  myRoster.push(player);

  updateClock();
  renderPlayers();
  renderRoster();
  updateRecommendation();
}

function renderPlayers() {

  const search =
    document.getElementById("search").value.toLowerCase();

  const available = players.filter(p => {

    const matchesPosition =
      filter === "ALL" || p.p === filter;

    const matchesSearch =
      p.n.toLowerCase().includes(search);

    return matchesPosition && matchesSearch;
  });

  document.getElementById("playerCount").textContent =
    `${available.filter(p => !drafted.includes(p.r)).length} available`;

  document.getElementById("players").innerHTML =
    available.map(p => {

      const isDrafted = drafted.includes(p.r);

      return `
        <div
          class="player ${isDrafted ? "drafted" : ""}"
          onclick="${isDrafted ? "" : `draftPlayer(${p.r})`}"
        >

          <div class="rank">
            ${p.r}
          </div>

          <div>
            <div class="player-name">
              ${p.n}
            </div>

            <div class="meta">
              ${p.p} • ${p.t}
            </div>
          </div>

          <div class="value">
            <div class="value-number">
              ${p.v}
            </div>
            <div class="value-label">
              VALUE
            </div>
          </div>

        </div>
      `;

    }).join("");
}

function renderRoster() {

  document.getElementById("rosterCount").textContent =
    `${myRoster.length} / 14`;

  let html = "";

  rosterSlots.forEach((slot, index) => {

    const player = myRoster[index];

    html += `
      <div class="roster-slot">
        <strong>${slot}</strong>
        <span>
          ${player ? player.n : "—"}
        </span>
      </div>
    `;

  });

  document.getElementById("roster").innerHTML = html;
}

function updateClock() {

  const pickNumber =
    myRoster.length === 0
      ? 1
      : myRoster.length * 10 + 1;

  const round =
    Math.ceil(pickNumber / 10);

  const pickInRound =
    ((pickNumber - 1) % 10) + 1;

  document.getElementById("nextPick").textContent =
    `${round}.${String(pickInRound).padStart(2, "0")}`;

  document.getElementById("pickDetail").textContent =
    `Your pick #${pickNumber}`;
}

function updateRecommendation() {

  const available =
    players.filter(p => !drafted.includes(p.r));

  if (!available.length) return;

  const best =
    available.reduce((a,b) => a.v > b.v ? a : b);

  document.getElementById("recPlayer").textContent =
    best.n;

  document.getElementById("recReason").textContent =
    `${best.p} • ${best.t} • Overall rank ${best.r}. Highest remaining draft value on the current board.`;
}

function resetDraft() {

  if (!confirm("Reset the entire draft?")) return;

  drafted = [];
  myRoster = [];

  updateClock();
  renderPlayers();
  renderRoster();
  updateRecommendation();
}

renderPlayers();
renderRoster();
updateClock();
updateRecommendation();

</script>

</body>
</html>
